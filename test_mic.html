<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --chat-bg: #1a1a1a;
            --user-msg: #2563eb;
            --ai-msg: #2a2a2a;
            --text-color: #e5e5e5;
            --accent: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header / Visualizer Area */
        .visualizer-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-direction: column;
        }

        .orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent), transparent);
            box-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent);
            transition: all 0.2s ease;
            opacity: 0.5;
            transform: scale(1);
        }

        .orb.listening {
            animation: pulse 1.5s infinite ease-in-out;
            background: radial-gradient(circle, #ef4444, transparent); /* Red when recording */
            box-shadow: 0 0 40px #ef4444;
            opacity: 0.8;
        }

        .orb.speaking {
            animation: speak 0.5s infinite alternate;
            background: radial-gradient(circle, #10b981, transparent); /* Green when speaking */
            box-shadow: 0 0 60px #10b981;
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        @keyframes speak {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        .status-text {
            margin-top: 40px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            mask-image: linear-gradient(to bottom, transparent, black 10%);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%);
        }

        .message {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 16px;
            animation: fadeIn 0.3s ease;
        }

        .user-message {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Controls */
        .controls {
            padding: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(to top, #000, transparent);
        }

        button {
            padding: 16px 32px;
            border-radius: 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        #startBtn {
            background-color: var(--text-color);
            color: #000;
        }

        #stopBtn {
            background-color: #2a2a2a;
            color: #ef4444;
        }

        button:hover { filter: brightness(0.9); }
        button:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="visualizer-container">
        <div id="orb" class="orb"></div>
        <div id="status" class="status-text">Ready</div>
    </div>

    <div id="chat" class="chat-container">
        </div>

    <div class="controls">
        <button id="startBtn" onclick="startSession()">Start Listening</button>
        <button id="stopBtn" onclick="stopSession()">Stop</button>
    </div>

    <script>
        let ws;
        let mediaRecorder;
        let audioContext;
        let isPlaying = false;

        // UI Elements
        const orb = document.getElementById('orb');
        const statusText = document.getElementById('status');
        const chat = document.getElementById('chat');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
            msgDiv.innerText = text;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        async function startSession() {
            // Init Safari Audio
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();
            
            statusText.innerText = "Connecting...";
            
            ws = new WebSocket("ws://localhost:8000/ws/audio");
            ws.binaryType = 'arraybuffer';
            
            ws.onopen = async () => {
                statusText.innerText = "Listening...";
                orb.classList.add('listening');
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                    
                    mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0 && ws.readyState === 1) ws.send(e.data);
                    };
                    mediaRecorder.start(250);
                } catch (err) {
                    addMessage("Microphone Error: " + err.message, 'ai');
                }
            };

            ws.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const data = JSON.parse(event.data);
                    addMessage(data.content, 'ai');
                } else {
                    playAudio(event.data);
                }
            };
            
            ws.onclose = () => {
                statusText.innerText = "Disconnected";
                orb.classList.remove('listening');
                orb.classList.remove('speaking');
            };
        }

        async function playAudio(arrayBuffer) {
            try {
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                
                orb.classList.remove('listening');
                orb.classList.add('speaking');
                
                source.start(0);
                
                source.onended = () => {
                    orb.classList.remove('speaking');
                    orb.classList.add('listening');
                };
            } catch (e) {
                console.error("Decode Error", e);
            }
        }

        function stopSession() {
            if (mediaRecorder) mediaRecorder.stop();
            if (ws) ws.close();
            orb.classList.remove('listening');
            orb.classList.remove('speaking');
            statusText.innerText = "Stopped";
        }
    </script>
</body>
</html>
